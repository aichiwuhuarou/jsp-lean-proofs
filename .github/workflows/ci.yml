name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Axiom audit
        run: |
          printf 'import JSP000288\nimport JSP000301\nimport JSP000598\n#print axioms jsp_000288\n#print axioms counterexample\n#print axioms jsp598\n' > Audit.lean
          lake env lean Audit.lean
