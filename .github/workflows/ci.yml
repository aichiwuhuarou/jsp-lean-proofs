name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: "lake build"
      - name: Axiom audit
        run: |
          cat > Audit.lean << 'LEAN'
          import JSP000288
          import JSP000301
          import JSP000598
          #print axioms jsp_000288
          #print axioms counterexample
          #print axioms jsp598
          LEAN
          sed -i 's/^          //' Audit.lean
          lake env lean Audit.lean
